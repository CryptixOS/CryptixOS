    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - zlib
      - xz-utils
    revision: 1
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
    build:
      - args: ['make', 'prefix=/usr', '-j@PARALLELISM@']
        environ:
          CC: '@OPTION:arch-triple@-gcc'
          CXX: '@OPTION:arch-triple@-g++'
      - args: ['make', 'prefix=/usr', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

