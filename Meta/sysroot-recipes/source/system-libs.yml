sources:
  - name: 'cmake'
    subdir: 'sources'
    git: 'https://gitlab.kitware.com/cmake/cmake.git'
    tag: 'v4.0.0'
    version: '4.0.0'
  - name: file
    subdir: 'sources'
    git: 'https://github.com/file/file.git'
    tag: 'FILE5_44'
    version: '5.44'
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.15
      - host-libtool
    regenerate:
      - args: ['autoreconf', '-f', '-i']

  - name: gettext
    subdir: 'sources'
    url: 'https://ftp.gnu.org/pub/gnu/gettext/gettext-0.22.3.tar.gz'
    checksum: blake2b:aebe85a82cb94c37ed81e9801acf1e89d150f5992fb9be42d53b3f2734c5c95804f0051fabc26b8d0892dfaf89d18df16d4bca6bcb2e9b95eef5d4ae93a64379
    extract_path: 'gettext-0.22.3'
    format: 'tar.gz'
    version: '0.22.3'
  - name: gnulib
    subdir: sources
    git: 'https://github.com/coreutils/gnulib.git'
    commit: 'b65a8d11a79bd72224deb06cf379bcbbd713fe36'
    branch: 'master'
    version: '20250811'

  - name: libffi
    subdir: 'sources'
    git: 'https://github.com/libffi/libffi.git'
    tag: 'v3.4.4'
    version: '3.4.4'
    tools_required:
      - host-autoconf-v2.71
      - host-automake-v1.11
      - host-libtool
    regenerate:
      - args: ['./autogen.sh']
      - args: ['cp',
          '@BUILD_ROOT@/tools/host-automake-v1.11/share/automake-1.11/config.sub',
          '@THIS_SOURCE_DIR@/']
  - name: linux-headers
    subdir: 'sources'
    url: 'https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.10.tar.xz'
    extract_path: 'linux-6.1.10'
    format: 'tar.xz'
    version: '6.1.10'

  - name: mlibc
    subdir: 'sources'
    git: 'https://github.com/managarm/mlibc.git'
    branch: 'master'
    rolling_version: true
    version: '0.0pl@ROLLING_ID@'

  - name: python
    subdir: 'sources'
    git: 'https://github.com/python/cpython.git'
    tag: 'v3.10.12'
    version: '3.10.12'
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.15
      - host-libtool
      - host-pkg-config
      - host-autoconf-archive
    regenerate:
      - args: ['autoreconf', '-f', '-i']

  - name: rust-backtrace
    subdir: 'sources'
    git: 'https://github.com/rust-lang/backtrace-rs.git'
    tag: '0.3.75'
    version: '0.3.75'
  - name: rust-calloop
    subdir: 'sources'
    git: 'https://github.com/Smithay/calloop.git'
    tag: 'v0.10.0'
    version: '0.10.0'
  - name: rust-cc
    subdir: 'sources'
    git: 'https://github.com/rust-lang/cc-rs.git'
    tag: 'cc-v1.2.17'
    version: '1.2.17'
  - name: rust-errno
    subdir: 'sources'
    git: 'https://github.com/lambda-fairy/rust-errno.git'
    tag: 'v0.3.10'
    version: '0.3.10'
  - name: rust-getrandom-0.2
    subdir: 'sources'
    git: 'https://github.com/rust-random/getrandom.git'
    tag: 'v0.2.15'
    version: '0.2.15'
  - name: rust-getrandom-0.3
    subdir: 'sources'
    git: 'https://github.com/rust-random/getrandom.git'
    tag: 'v0.3.2'
    version: '0.3.2'
  - name: rust-glutin
    subdir: 'sources'
    git: 'https://github.com/rust-windowing/glutin.git'
    tag: 'v0.29.1'
    version: '0.29.1'
  - name: rust-libc
    subdir: 'sources'
    git: 'https://github.com/rust-lang/libc.git'
    tag: '0.2.175'
    version: '0.2.175'
  - name: rust-libloading-0.7
    subdir: 'sources'
    git: 'https://github.com/nagisa/rust_libloading.git'
    tag: '0.7.4'
    version: '0.7.4'
  - name: rust-libloading-0.8
    subdir: 'sources'
    git: 'https://github.com/nagisa/rust_libloading.git'
    tag: '0.8.6'
    version: '0.8.6'
  - name: rust-mac-address
    subdir: 'sources'
    git: 'https://github.com/repnop/mac_address.git'
    branch: 'master'
    commit: '9a1723346265a9fb04cc58c0995ca18b967c0a4a' # No tags here
    version: '1.2.8'
  - name: rust-mio-0.6
    subdir: 'sources'
    git: 'https://github.com/tokio-rs/mio.git'
    tag: 'v0.6.23'
    version: '0.6.23'
  - name: rust-mio-0.8
    subdir: 'sources'
    git: 'https://github.com/tokio-rs/mio.git'
    tag: 'v0.8.3'
    version: '0.8.3'
  - name: rust-mio-1.0
    subdir: 'sources'
    git: 'https://github.com/tokio-rs/mio.git'
    tag: 'v1.0.3'
    version: '1.0.3'
  - name: rust-nix-0.24
    subdir: 'sources'
    git: 'https://github.com/nix-rust/nix.git'
    tag: 'v0.24.3'
    version: '0.24.3'
  - name: rust-nix-0.29
    subdir: 'sources'
    git: 'https://github.com/nix-rust/nix.git'
    tag: 'v0.29.0'
    version: '0.29.0'
  - name: rust-num-cpus
    subdir: 'sources'
    git: 'https://github.com/seanmonstar/num_cpus.git'
    tag: 'v1.15.0'
    version: '1.15.0'
  - name: rust-patched-libs
    subdir: 'sources'
    sources_required:
      - name: rust-backtrace
        recursive: true
      - name: rust-calloop
        recursive: true
      - name: rust-getrandom-0.2
        recursive: true
      - name: rust-getrandom-0.3
        recursive: true
      - name: rust-libc
        recursive: true
      - name: rust-libloading-0.7
        recursive: true
      - name: rust-libloading-0.8
        recursive: true
      - name: rust-mio-0.6
        recursive: true
      - name: rust-mio-0.8
        recursive: true
      - name: rust-mio-1.0
        recursive: true
      - name: rust-nix-0.24
        recursive: true
      - name: rust-nix-0.29
        recursive: true
      - name: rust-num-cpus
        recursive: true
      - name: rust-users
        recursive: true
      - name: rust-winit
        recursive: true
      - name: rust-glutin
        recursive: true
      - name: rust-shared-library
        recursive: true
      - name: rust-errno
        recursive: true
      - name: rust-rustix-0.38
        recursive: true
      - name: rust-rustix-1.0
        recursive: true
      - name: rust-uzers
        recursive: true
      - name: rust-cc
        recursive: true
      - name: rust-termios
        recursive: true
      - name: rust-mac-address
        recursive: true
  - name: rust-rustix-0.38
    subdir: 'sources'
    git: 'https://github.com/bytecodealliance/rustix.git'
    tag: 'v0.38.44'
    version: '0.38.44'
  - name: rust-rustix-1.0
    subdir: 'sources'
    git: 'https://github.com/bytecodealliance/rustix.git'
    tag: 'v1.0.5'
    version: '1.0.5'
  - name: rust-shared-library
    subdir: 'sources'
    git: 'https://github.com/tomaka/shared_library.git'
    commit: 'f09e038246a559650c8505b3b3831b820d1a5689'
    branch: 'master'
    version: '0.1.9'
  - name: rust-termios
    subdir: 'sources'
    git: 'https://github.com/dcuddeback/termios-rs.git'
    tag: 'v0.3.3'
    version: '0.3.3'
  - name: rust-users
    subdir: 'sources'
    git: 'https://github.com/ogham/rust-users.git'
    tag: 'v0.11.0'
    version: '0.11.0'
  - name: rust-uzers
    subdir: 'sources'
    git: 'https://github.com/rustadopt/uzers-rs.git'
    tag: 'v0.12.1'
    version: '0.12.1'
  - name: rust-winit
    subdir: 'sources'
    git: 'https://github.com/rust-windowing/winit.git'
    tag: 'v0.27.5'
    version: '0.27.5'
