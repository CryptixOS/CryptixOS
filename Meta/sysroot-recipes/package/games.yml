packages:
  - name: games
    labels: [aarch64]
    architecture: noarch
    source:
      subdir: 'sources'
      version: '1.0'
    pkgs_required:
      - doom-generic
      - nyancat
    configure: []
    build: []

  - name: doom-generic
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    source:
      subdir: 'sources'
      url: 'https://github.com/NSG650/doomgeneric-polaris/archive/4fb357cc9535ae35144d107d5c854c7407d3eefc.tar.gz'
      format: 'tar.gz'
      extract_path: 'doom-generic'
      version: '4.0'
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
      regenerate:
        - args: ['autoreconf', '-fvi']
        - args: ['cp', '@THIS_SOURCE_DIR@/configfsf.guess', '@THIS_SOURCE_DIR@/config.guess']
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.15
      - system-gcc
    pkgs_required:
      - mlibc
      - libiconv
    revision: 1
    configure:
      - args: ['cp', '-rp', '@THIS_SOURCE_DIR@/doomgeneric', '@THIS_COLLECT_DIR@']
    build:
      - args: ['make', '-C', '@THIS_SOURCE_DIR@/doomgeneric', '-j@PARALLELISM@']
      - args: ['cp', '@THIS_SOURCE_DIR@/doomgeneric/doomgeneric', '@SYSROOT_DIR@/bin']
  - name: nyancat
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: The famous nyancat
      description: This package provides Nyancat in your terminal, rendered through ANSI escape sequences.
      spdx: 'no-spdx: UoI-NCSA'
      website: 'https://github.com/klange/nyancat'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['games-misc']
    source:
      subdir: 'sources'
      git: 'https://github.com/klange/nyancat.git'
      tag: '1.5.2'
      version: '1.5.2'
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
    revision: 10
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
    build:
      - args: ['make', '-j@PARALLELISM@']
        environ:
          CC: "@OPTION:arch-triple@-gcc"
      - args: ['mkdir', '-pv', '@THIS_COLLECT_DIR@/usr/bin']
      - args: ['mkdir', '-pv', '@THIS_COLLECT_DIR@/usr/share/man/man1']
      - args: ['cp', '-v', '@THIS_BUILD_DIR@/src/nyancat', '@THIS_COLLECT_DIR@/usr/bin']
      - args: ['cp', '-v', '@THIS_BUILD_DIR@/nyancat.1', '@THIS_COLLECT_DIR@/usr/share/man/man1']
  

