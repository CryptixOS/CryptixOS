packages:
  - name: aurora 
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    source:
      subdir: 'sources'
      git: 'https://github.com/CryptixOS/Aurora.git'
      branch: 'main'
    tools_required:
      - system-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - prism
      - neon
    configure: 
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@SOURCE_ROOT@/CrossFiles/@OPTION:arch-triple@-target.cross-file'
        - '--prefix=/usr'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/sbin']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/root']
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: false
