packages:
  - name: shell-apps
    labels: [aarch64]
    architecture: noarch
    source:
      subdir: 'sources'
      version: '1.0'
    pkgs_required:
      - awsh
      - bash
      - dash
      - zsh
    configure: []
    build: []

  - name: awsh 
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    source:
      subdir: 'sources'
      version: '0.1'
      git: 'https://github.com/CryptixOS/Aurora.git'
      branch: 'main'
    tools_required:
      - system-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - prism
    configure: 
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@SOURCE_ROOT@/CrossFiles/@OPTION:arch-triple@-target.cross-file'
        - '--prefix=/usr'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true
  - name: bash
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: The standard GNU Bourne again shell
      description: This package provides the Bourne-Again SHell.
      spdx: 'GPL-3.0-or-later'
      website: 'https://tiswww.case.edu/php/chet/bash/bashtop.html'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['app-shells']
    source:
      subdir: 'sources'
      url: 'https://ftp.gnu.org/gnu/bash/bash-5.1.tar.gz'
      format: 'tar.gz'
      extract_path: 'bash-5.1'
      version: '5.1'
      patch-path-strip: 1
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
      regenerate:
        # While we do not need to regenerate the configure script, we need to touch it
        # after patching config.sub so that make does not try to regenerate it.
        - args: ['autoconf']
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.15
      - system-gcc
    pkgs_required:
      - mlibc
      - ncurses
      - readline
      - libiconv
    revision: 12
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--without-bash-malloc'
        - '--disable-nls'
        - '--with-installed-readline=$SYSROOT_DIR$/usr'
        - 'CFLAGS_FOR_BUILD=-std=gnu89'
        - 'CFLAGS=-std=c89'
        environ:
          ac_cv_func_wcswidth: 'no'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']
        quiet: true
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/root/']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/home/cryptix/']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/etc/']
      - args: ['ln', '-sf', 'bash', '@THIS_COLLECT_DIR@/usr/bin/sh']
  - name: dash
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: Debian Almquist SHell
      description: This package provides the Debian Almquist SHell, the default shell on debian.
      spdx: 'BSD'
      website: 'http://gondor.apana.org.au/~herbert/dash/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
    source:
      subdir: 'sources'
      git: 'https://git.kernel.org/pub/scm/utils/dash/dash.git'
      tag: 'v0.5.12'
      version: '0.5.12'
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
      regenerate:
        - args: ['./autogen.sh']
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
    revision: 1
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--enable-fnmatch'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: zsh
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: 'UNIX Shell similar to the Korn shell'
      description: 'Zsh is a shell designed for interactive use, although it is also a powerful scripting language. Many of the useful features of bash, ksh, and tcsh were incorporated into zsh; many original features were added.'
      spdx: 'MIT'
      website: 'https://zsh.sourceforge.io/'
      maintainer: "no92 <no92.mail@gmail.com>"
      categories: ['app-shells']
    source:
      subdir: 'sources'
      git: 'https://git.code.sf.net/p/zsh/code'
      tag: 'zsh-5.9'
      version: '5.9'
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.11
      regenerate:
        - args: ['./Util/preconfig']
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.11/share/automake-1.11/config.sub',
            '@THIS_SOURCE_DIR@/']
        - args: |
            sed -e 's/^main/int &/' -e 's/exit(/return(/' -i aczsh.m4 @THIS_SOURCE_DIR@/configure.ac
        - args: |
            sed -e 's/test = /&(char**)/' -i @THIS_SOURCE_DIR@/configure.ac
    tools_required:
      - host-yodl
      - system-gcc
    pkgs_required:
      - mlibc
      - ncurses
      - gdbm
      - pcre
    revision: 3
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--quiet'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--sysconfdir=/etc/zsh'
        - '--enable-etcdir=/etc/zsh'
        - '--enable-gdbm'
        - '--enable-pcre'
        - 'CFLAGS=-DHAVE_TERMIOS_H -std=gnu23'
    build:
      - args: ['make', 'prep']
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']
        quiet: true

