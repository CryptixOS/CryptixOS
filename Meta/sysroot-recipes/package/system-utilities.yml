packages:
  - name: openposixtestsuite
    labels: [aarch64]
    architecture: noarch
    from_source: 'openposixtestsuite'
    tools_required:
      - system-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
    build:
      - args: ['make', 'build_tests']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true

  - name: sys-apps
    labels: [aarch64]
    architecture: noarch
    source:
      subdir: 'sources'
      version: '0.1'
    pkgs_required:
      - cryptix-utils
      - coreutils
      - file 
      - less
      - neofetch
      - procps
      - sysstat
      - util-linux
      - which
    configure: []
    build: []

  - name: cryptix-utils
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    source:
      subdir: 'sources'
      git: 'https://github.com/CryptixOS/Cryptix-Utils.git'
      branch: 'main'
      version: '0.1'
    tools_required:
      - system-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - ncurses
      - prism
      - neon
    configure: 
      - args:
        - 'meson'
        - 'setup'
        - '--cross-file'
        - '@SOURCE_ROOT@/CrossFiles/@OPTION:arch-triple@-target.cross-file'
        - '--prefix=/usr'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/sbin']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/root']
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true

  - name: coreutils
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    source:
      subdir: 'sources'
      url: 'https://ftp.gnu.org/gnu/coreutils/coreutils-9.1.tar.xz'
      format: tar.xz
      checksum: 'blake2b:f5654e4935535275615d44a56c071d1c0746af36cf4615fcc0a5a0d387af9c9023adac31f31a52e16b3d1105b9d4c0fb7ebff9b2862498849f867a866049dd6e'
      extract_path: 'coreutils-9.1'
      version: '9.1'
      tools_required:
        - host-automake-v1.15
        - host-autoconf-v2.69
      regenerate:
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.15/share/automake-1.15/config.sub',
            '@THIS_SOURCE_DIR@/build-aux/']
    tools_required:
      - system-gcc
      - host-automake-v1.15
    pkgs_required:
      - mlibc
    configure:
      # Huge hack: coreutils does not compile the build-machine binary make-prime-list
      # using the build-machine compiler. Hence, build and invoke the binary manually here.
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        environ: 
          ac_cv_sys_largefile_opts: 'none needed'
          ac_cv_sys_year2038_opts: 'none needed'
      - args: ['make', 'src/make-prime-list']
      - args: |
          ./src/make-prime-list 5000 > @THIS_SOURCE_DIR@/src/primes.h
      - args: ['make', 'clean']
      # Now compile coreutils for the correct target.
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--disable-nls'
        - 'CFLAGS=-DSLOW_BUT_NO_HACKS -Wno-error'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
        quiet: true

  - name: file
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    from_source: file
    tools_required:
      - system-gcc
      - host-file
    pkgs_required:
      - mlibc
      - zlib
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--disable-bzlib'
        - '--disable-xzlib'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: grep
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: GNU regular expression matcher
      description: This package contains programs for searching through the contents of files.
      spdx: 'GPL-3.0-or-later'
      website: 'https://www.gnu.org/software/grep/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: sources
      url: 'https://ftp.man.poznan.pl/gnu/grep/grep-3.11.tar.gz'
      format: 'tar.gz'
      checksum: blake2b:fd364b9e325b7fe4b5e0d120fcd1c9eed4122ce6aecba51b3f34f08168aa913f5362862e2348eb4a37ef964c7c3aa9a14e0c930ad527ed6aa49b8539e6fd630e
      extract_path: 'grep-3.11'
      version: '3.11'
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
      regenerate:
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.15/share/automake-1.15/config.sub',
            '@THIS_SOURCE_DIR@/build-aux/']
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - pcre
    revision: 7
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--disable-nls'
      - args: 'sed -i s/-Werror//g @THIS_BUILD_DIR@/lib/Makefile'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: less
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: Excellent text file viewer
      description: This package contains a text file viewer.
      spdx: 'GPL-3-only BSD-2-Clause'
      website: 'https://www.greenwoodsoftware.com/less/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    source:
      subdir: sources
      url: 'http://www.greenwoodsoftware.com/less/less-668.tar.gz'
      format: 'tar.gz'
      checksum: blake2b:0f6a85a1c66577dd2a28682a6f8399e42fdbe9fc1498b2e89c6bb7c47109e8d3ab934abe5dd998b2c8dfacfb174ad9daeb79b3d4c13df22fa035ea792b2eaf5e
      extract_path: 'less-668'
      version: '668'
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - ncurses
    revision: 1
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--sysconfdir=/etc'
        - 'LIBS=-lncurses'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'DESTDIR=@THIS_COLLECT_DIR@', 'install']

  - name: neofetch
    labels: [aarch64]
    architecture: noarch
    source:
      subdir: sources
      git: 'https://github.com/64/neofetch.git'
      branch: 'master'
      commit: 'd27a0bd748310d8ace673a614f745303b444e00e'
      version: '7.2.0'
    revision: 8
    configure:
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
    build:
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: procps
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: Standard informational utilities and process-handling tools
      description: The Procps-ng package contains programs for monitoring processes.
      spdx: 'GPL-2.0-or-later LGPL-2.0-or-later LGPL-2.1-or-later'
      website: 'https://gitlab.com/procps-ng/procps'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-process']
    source:
      subdir: sources
      git: 'https://gitlab.com/procps-ng/procps.git'
      tag: 'v4.0.5'
      version: '4.0.5'
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
        - host-libtool
        - host-pkg-config
      regenerate:
        - args: ['./autogen.sh']
    tools_required:
      - system-gcc
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - ncurses
    revision: 1
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--disable-static'
        - '--docdir=/usr/share/doc/procps-ng-4.0.5'
        - '--disable-numa'
        - '--enable-colorwatch'
        - '--disable-nls'
        - '--disable-w'
        - '--without-systemd'
        - '--disable-pidwait'
        environ:
          ac_cv_func_malloc_0_nonnull: 'yes'
          ac_cv_func_realloc_0_nonnull: 'yes'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: sysstat
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    metadata:
      summary: System performance tools
      description: This package contains a collection of command-line applications to track system statistics.
      spdx: 'GPL-2'
      website: 'https://gitlab.gnome.org/GNOME/gsettings-desktop-schemas'
      maintainer: "Alexander Richards <electrodeyt@gmail.com>"
      categories: ['app-admin']
    source:
      subdir: 'sources'
      url: 'https://github.com/sysstat/sysstat/archive/refs/tags/v12.7.4.tar.gz'
      format: 'tar.gz'
      extract_path: 'sysstat-12.7.4'
      checksum: blake2b:3b74dcc785e88fd2de93ed30bc80b834f9a36e8f00136230497f681257a3b40eea200f5f364689de52c0d13bf1612b2e45cf4bb7e2a1ab9d74ed37ec3590ebf0
      version: '12.7.4'
    tools_required:
      - system-gcc
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
    revision: 6
    configure:
      # Sysstat really wants to be configured in the same tree.
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
      - args:
        - '@THIS_BUILD_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--sysconfdir=/etc'
        - '--localstatedir=/run'
        - '--enable-copy-only'
        - '--disable-sensors'
        - '--disable-nls'
        - '--disable-pcp'
        - '--disable-documentation'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'

  - name: util-linux
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    from_source: util-linux
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - util-linux-libs
      - readline
      - ncurses
      - zlib
      - libiconv
      - file
      #- libxcrypt
      - pcre2
    revision: 17
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--exec-prefix=/usr'
        - '--libdir=/usr/lib'
        - '--bindir=/usr/bin'
        - '--sbindir=/usr/sbin'
        - '--without-udev'
        - '--disable-nls'
        - '--disable-static'
        - '--disable-eject'
        - '--without-python'
        - '--without-systemd'
        - '--without-systemdsystemunitdir'
        - '--disable-partx'
        - '--disable-fallocate'
        - '--disable-unshare'
        - '--disable-nsenter'
        - '--disable-setpriv'
        - '--enable-eject'
        - '--disable-plymouth_support'
        - '--disable-fdformat'
        - '--disable-hwclock'
        - '--disable-hwclock-cmos'
        - '--disable-hwclock-gplv3'
        - '--disable-wdctl'
        - '--disable-logger'
        - '--enable-switch_root'
        - '--disable-pivot_root'
        - '--disable-chmem'
        - '--disable-ipcrm'
        - '--disable-ipcs'
        - '--disable-irqtop'
        - '--disable-rfkill'
        - '--disable-utmpdump'
        - '--disable-raw'
        - '--disable-chfn-chsh'
        - '--disable-login'
        - '--disable-nologin'
        - '--disable-sulogin'
        - '--disable-su'
        - '--disable-runuser'
        - '--disable-setterm'
        - '--disable-schedutils'
        - '--disable-pg-bell'
        - '--disable-fstrim'
        - '--disable-swapon'
        - '--disable-lscpu'
        - '--disable-chcpu'
        - '--disable-blockdev'
        - '--disable-prlimit'
        - '--disable-lsipc'
        - '--disable-lsns'
        - '--disable-readprofile'
        - '--enable-dmesg'
        - '--disable-fincore'
        - '--disable-fsfreeze'
        - '--disable-blkdiscard'
        - '--disable-blkzone'
        - '--disable-ldattach'
        - '--disable-rtcwake'
        - '--disable-setarch'
        - '--disable-tunelp'
        - '--enable-write'
        - '--without-cap-ng'
        - '--without-btrfs'
        - '--without-selinux'
        - '--without-audit'
        - '--enable-usrdir-path'
        - '--disable-makeinstall-chown'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['rm', '-r', '@THIS_COLLECT_DIR@/usr/include']
      - args: ['rm', '-r', '@THIS_COLLECT_DIR@/usr/lib']
      - args: ['rm', '-r', '@THIS_COLLECT_DIR@/usr/share/man/man3']
      - args: ['rm', '-r', '@THIS_COLLECT_DIR@/usr/share/man/man5/terminal-colors.d.5']

  - name: which
    labels: [aarch64]
    architecture: '@OPTION:arch@'
    source:
      subdir: sources
      url: 'https://ftp.gnu.org/gnu/which/which-2.21.tar.gz'
      format: 'tar.gz'
      checksum: blake2b:355888b0dfe3e4e1679a8a9e1255a935fa48be220408abc441fae69fe0b26bd39e0544ed20e75497ed5bccaa75e788d9aec17007c668f15eaf6b1599faa131a0
      extract_path: 'which-2.21'
      version: '2.21'
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
    revision: 9
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - 'CFLAGS=-std=gnu89'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'


